connector.name=postgresql
connection-url=jdbc:postgresql://lh-postgres:5432/source
connection-user=ekos
connection-password=${ENV:PG_PASSWORD}
# Required on every source catalog (RFC 0192 §1): without them the connector silently drops
# columns of types it does not map.
postgresql.array-mapping=AS_ARRAY
unsupported-type-handling=CONVERT_TO_VARCHAR
