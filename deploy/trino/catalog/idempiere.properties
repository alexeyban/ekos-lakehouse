# RFC 0216: the iDempiere testbed (EKOS `docker-compose.oracle.yml`) as a source catalog.
# The Oracle container joins this stack's network once:
#   docker network connect ekos-lakehouse_default ekos-oracle-xe-1
# `ekos_ro` is the testbed's read-only user (SELECT_CATALOG_ROLE + READ on ADEMPIERE).
connector.name=oracle
connection-url=jdbc:oracle:thin:@//ekos-oracle-xe-1:1521/XEPDB1
connection-user=ekos_ro
connection-password=${ENV:ORA_PASSWORD}
unsupported-type-handling=CONVERT_TO_VARCHAR
