connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lh-polaris:8181/api/catalog
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:CLIENT_ID}:${ENV:CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.http-headers=Polaris-Realm: POLARIS
# SeaweedFS has no STS: static keys instead of credentials vended by Polaris.
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://lh-seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
