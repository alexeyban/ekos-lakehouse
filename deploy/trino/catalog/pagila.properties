# The M1 fixture: Pagila. EKOS Lakehouse requires two connector settings on a source catalog:
# with the defaults the connector silently drops every column of a type it does not map
# (measured on Pagila: a domain, `text[]`, `tsvector` — 3 of 94 columns, with no error).
connector.name=postgresql
connection-url=jdbc:postgresql://lh-postgres:5432/pagila
connection-user=ekos
connection-password=${ENV:PG_PASSWORD}
postgresql.array-mapping=AS_ARRAY
unsupported-type-handling=CONVERT_TO_VARCHAR
