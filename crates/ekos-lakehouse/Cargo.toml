[package]
name = "ekos-lakehouse"
description = "The EKOS CLI with EKOS Lakehouse installed (RFC 0190)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ekos-lakehouse"
path = "src/main.rs"

[features]
# RFC 0216: Oracle sources, for steps 1-3 (EKOS's live catalog) and 5-7 (the lakehouse).
oracle = ["ekos/oracle", "ekos-lakehouse-ext/oracle"]

[dependencies]
ekos.workspace = true
ekos-lakehouse-ext.workspace = true
anyhow.workspace = true
tokio.workspace = true
