[package]
name = "ekos-lakehouse-etl-dbt"
description = "The engine-neutral half of ETL → dbt for the lakehouse: table resolution against the plan, PostgreSQL → Trino source SQL, model checks (EKOS RFC 0268). Pure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ekos-lakehouse-etl-expr.workspace = true
ekos-lakehouse-etl-rel.workspace = true
ekos-lakehouse-bronze.workspace = true
ekos-lakehouse-silver.workspace = true
ekos-plugin-sql-dialect-trino = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-sql-dialect-sdk = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
sqlparser = { workspace = true, features = ["visitor"] }
