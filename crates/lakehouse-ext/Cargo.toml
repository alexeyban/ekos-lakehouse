[package]
name = "ekos-lakehouse-ext"
description = "EKOS Lakehouse as an EKOS extension: commands, MCP tools, post-commit steps (RFC 0190)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# RFC 0216: Oracle as a source. The driver (rust-oracle) compiles with a C compiler and loads
# Oracle Instant Client at run time; without the feature an Oracle source reports that the
# driver was not built.
oracle = ["ekos-ora-live/oracle"]

[dependencies]
ekos.workspace = true
ekos-common.workspace = true
ekos-compiler-core.workspace = true
ekos-lakehouse-bronze.workspace = true
ekos-lakehouse-silver.workspace = true
ekos-lakehouse-changes.workspace = true
ekos-lakehouse-gold.workspace = true
ekos-lakehouse-health.workspace = true
ekos-lakehouse-kettle.workspace = true
ekos-lakehouse-kettle-expr.workspace = true
ekos-lakehouse-kettle-rel.workspace = true
ekos-lakehouse-pentaho-dbt.workspace = true
ekos-recovery.workspace = true
ekos-lakehouse-trino.workspace = true
ekos-kir.workspace = true
ekos-ledger.workspace = true
ekos-semantic.workspace = true
ekos-migrate.workspace = true
ekos-migrate-validate.workspace = true
ekos-pg-live.workspace = true
ekos-ora-live.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
toml.workspace = true
postgres = "0.19"
