# EKOS Lakehouse — PostgreSQL → Apache Iceberg medallion pipelines, generated and kept in step
# with the source (RFC 0190 in github.com/alexeyban/EKOS). An extension of EKOS (RFC 0149 / 0191):
# it depends on the public EKOS crates; they never depend on this.
[workspace]
resolver = "3"
members = [
    "crates/bronze",
    "crates/silver",
    "crates/trino",
    "crates/lakehouse-ext",
    "crates/ekos-lakehouse",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexeyban/ekos-lakehouse"
rust-version = "1.98"

[workspace.dependencies]
# ── EKOS core. A release pins a tag; development follows main. ──
ekos               = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-compiler-core = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-migrate-validate = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-common           = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-kir              = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-ledger           = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-pg-live          = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
ekos-migrate          = { git = "https://github.com/alexeyban/EKOS", branch = "main" }
# The statement classifier (RFC 0160), used with Trino's grammar through `classify_with`.
ekos-migrate-target-clickhouse = { git = "https://github.com/alexeyban/EKOS", branch = "main" }

# ── This workspace ──
ekos-lakehouse-ext   = { path = "crates/lakehouse-ext" }
ekos-lakehouse-trino  = { path = "crates/trino" }
ekos-lakehouse-bronze = { path = "crates/bronze" }
ekos-lakehouse-silver = { path = "crates/silver" }

# ── Third party (versions match the EKOS workspace) ──
anyhow      = "1"
async-trait = "0.1"
clap        = "4"
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
sha2        = "0.10"
sqlparser   = "0.53"
thiserror   = "2"
tokio       = { version = "1", features = ["full"] }
toml        = "0.8"
uuid        = { version = "1", features = ["v5"] }

# Local development against a sibling EKOS checkout (`../EKOS`). Active while this repository
# needs EKOS changes that are not on its `main` yet (RFC 0191, the extension seam v2); comment it
# out to build against the git dependency. Every EKOS crate is listed: patching only some would
# mix two copies of the shared types.
[patch."https://github.com/alexeyban/EKOS"]
ekos-common                        = { path = "../EKOS/ekos/crates/common" }
ekos                               = { path = "../EKOS/ekos/crates/cli" }
ekos-artifact                      = { path = "../EKOS/ekos/crates/artifact" }
ekos-clickhouse-query              = { path = "../EKOS/ekos/crates/clickhouse-query" }
ekos-cluster                       = { path = "../EKOS/ekos/crates/cluster" }
ekos-compiler-core                 = { path = "../EKOS/ekos/crates/compiler-core" }
ekos-dbt-gen                       = { path = "../EKOS/ekos/crates/dbt-gen" }
ekos-distributed                   = { path = "../EKOS/ekos/crates/distributed" }
ekos-docs-gen                      = { path = "../EKOS/ekos/crates/docs-gen" }
ekos-ekl                           = { path = "../EKOS/ekos/crates/ekl" }
ekos-evals                         = { path = "../EKOS/ekos/crates/evals" }
ekos-identity                      = { path = "../EKOS/ekos/crates/identity" }
ekos-kir                           = { path = "../EKOS/ekos/crates/kir" }
ekos-ledger                        = { path = "../EKOS/ekos/crates/ledger" }
ekos-marketing                     = { path = "../EKOS/ekos/crates/marketing" }
ekos-observation-sdk               = { path = "../EKOS/ekos/crates/observation-sdk" }
