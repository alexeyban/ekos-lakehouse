ekos-migrate                       = { path = "../EKOS/ekos/crates/migrate" }
ekos-migrate-validate              = { path = "../EKOS/ekos/crates/migrate-validate" }
ekos-pg-live                       = { path = "../EKOS/ekos/crates/pg-live" }
